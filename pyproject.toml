version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zsk4", email = "zachary_katz@mines.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "altimetry-downloader-aviso>=0.5.0",
    "cartopy>=0.26.0",
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "pyproj>=3.8.0",
